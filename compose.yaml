services:
  db:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: wedding
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wedding
      SPRING_DATASOURCE_USERNAME: wedding
      WEDDING_MEDIA_DIR: /data/media
      # JVM remote debug (JDWP). suspend=n so the app starts normally; attach anytime on 5005.
      # address=*:5005 accepts connections from any interface -- fine for local/dev compose, never
      # expose 5005 on a host reachable from the internet (JDWP has no authentication).
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports: ["8080:8080", "5005:5005"]
    volumes: [media-data:/data/media]
  web-internal:
    build: ./frontend/internal
    depends_on:
      - api
    ports: ["3000:80"]
    restart: unless-stopped
  web-public:
    build: ./frontend/public
    depends_on:
      - api
    ports: ["3001:80"]
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
