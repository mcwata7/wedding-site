services:
  db:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: wedding
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wedding
      SPRING_DATASOURCE_USERNAME: wedding
      WEDDING_MEDIA_DIR: /data/media
    ports: ["8080:8080"]
    volumes: [media-data:/data/media]
  web-internal:
    build: ./frontend/internal
    depends_on:
      - api
    ports: ["3000:80"]
    restart: unless-stopped
  web-public:
    build: ./frontend/public
    depends_on:
      - api
    ports: ["3001:80"]
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
