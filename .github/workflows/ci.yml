name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Run backend tests (H2, no Postgres needed)
        working-directory: backend
        run: ./gradlew test

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [internal, public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install and build ${{ matrix.app }}
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm ci
          npm run build
