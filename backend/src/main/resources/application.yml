spring:
  application:
    name: wedding-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:wedding}}
    username: ${SPRING_DATASOURCE_USERNAME:wedding}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:wedding}}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
wedding:
  security:
    jwt-secret: ${WEDDING_SECURITY_JWT_SECRET:${JWT_SECRET:local-development-secret-change-me-please}}
    # 30 days: the guest token is persisted in localStorage, so a short lifetime would defeat the
    # point (guests would re-answer the verification question every couple of hours).
    guest-session-minutes: 43200
    planner-session-minutes: 480
  bootstrap-admin:
    email: ${WEDDING_BOOTSTRAP_ADMIN_EMAIL:${ADMIN_EMAIL:admin@example.com}}
    password: ${WEDDING_BOOTSTRAP_ADMIN_PASSWORD:${ADMIN_PASSWORD:change-me-before-sharing}}
  media:
    dir: ${WEDDING_MEDIA_DIR:data/media}
    max-bytes: ${WEDDING_MEDIA_MAX_BYTES:5242880}
  site:
    public-url: ${WEDDING_SITE_PUBLIC_URL:${PUBLIC_SITE_URL:http://localhost:3001}}
  slack:
    webhook-url: ${WEDDING_SLACK_WEBHOOK_URL:${SLACK_WEB_HOOK:}}
    enabled: ${WEDDING_SLACK_ENABLED:true}
  cors:
    # Comma-separated list of frontend origins allowed to call the API cross-origin. Leave blank
    # when frontends are served same-origin via an nginx reverse proxy (local/Docker Compose).
    allowed-origins: ${WEDDING_CORS_ALLOWED_ORIGINS:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
